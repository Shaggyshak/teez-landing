<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Teez</title>
<link rel="icon" href="/favicon.ico" />
<style>
  :root { --bg:#0c1117; --card:#141b23; --border:#1e293b; --green:#4ade80; --text:#e2e8f0; --dim:#94a3b8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .gate { height:100%; display:grid; place-items:center; padding:16px; }
  .box { width:100%; max-width:380px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:32px 28px; }
  .mark { font-family:ui-monospace,Menlo,monospace; letter-spacing:.3em; font-weight:700; font-size:15px; margin-bottom:22px; }
  .mark span { color:var(--green); }
  h1 { font-size:20px; margin-bottom:6px; }
  p { color:var(--dim); font-size:14px; margin-bottom:20px; }
  input { width:100%; padding:12px 14px; border-radius:9px; border:1px solid var(--border); background:#0c1117; color:var(--text); font-size:15px; outline:none; }
  input:focus { border-color:var(--green); }
  button { margin-top:12px; width:100%; padding:12px; border:0; border-radius:9px; background:var(--green); color:#0c1117; font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#f87171; font-size:13px; margin-top:10px; min-height:18px; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="box" id="form">
    <div class="mark">TEEZ<span>.</span></div>
    <h1>Pitch deck</h1>
    <p>Enter the password to continue.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus />
    <button id="go" type="submit">Open</button>
    <div class="err" id="err"></div>
  </form>
</div>

async function decrypt(pw) {
  const raw = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:250000, hash:'SHA-256' }, mat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(pt);
}
function show(html) {
  const f = document.createElement('iframe');
  f.setAttribute('allow', 'fullscreen');
  f.setAttribute('allowfullscreen', '');
  f.srcdoc = html;
  document.body.appendChild(f);
  document.getElementById('gate').style.display = 'none';
  f.addEventListener('load', () => { try { f.contentWindow.focus(); } catch (e) {} });
}
async function attempt(pw, quiet) {
  const err = document.getElementById('err'), go = document.getElementById('go');
  err.textContent = ''; go.disabled = true;
  try {
    const html = await decrypt(pw);
    try { sessionStorage.setItem('teez_deck_pw', pw); } catch (e) {}
    show(html);
  } catch (e) {
    if (!quiet) err.textContent = 'That password is not right.';
    try { sessionStorage.removeItem('teez_deck_pw'); } catch (e2) {}
    go.disabled = false;
  }
}
document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); attempt(document.getElementById('pw').value, false); });
try { const saved = sessionStorage.getItem('teez_deck_pw'); if (saved) attempt(saved, true); } catch (e) {}
